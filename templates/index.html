<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌌 Space Chat</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #352080 0%,
                    transparent 28%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #123c80 0%,
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #02010b,
                    #07051c,
                    #000
                );
        }

        /* 우주 별 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                radial-gradient(
                    white 1px,
                    transparent 1px
                ),
                radial-gradient(
                    #aaa 1px,
                    transparent 1px
                );

            background-size:
                80px 80px,
                140px 140px;

            background-position:
                10px 20px,
                40px 70px;

            opacity: 0.55;

            pointer-events: none;
        }

        .container {
            position: relative;

            width: min(900px, 94%);
            height: 90vh;

            margin: 5vh auto;

            display: flex;
            flex-direction: column;

            background: rgba(8, 8, 30, 0.78);

            border: 1px solid rgba(
                160,
                180,
                255,
                0.25
            );

            border-radius: 25px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 0 60px rgba(
                    80,
                    90,
                    255,
                    0.2
                );
        }

        header {
            padding: 20px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom:
                1px solid
                rgba(255,255,255,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        #status {
            color: #7cffc4;
            font-size: 13px;
        }

        #messages {
            flex: 1;

            padding: 25px;

            overflow-y: auto;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .message {
            width: fit-content;
            max-width: 75%;

            padding: 12px 16px;

            border-radius: 18px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.08);

            animation: appear 0.2s ease;
        }

        .mine {
            align-self: flex-end;

            background:
                linear-gradient(
                    135deg,
                    #536dff,
                    #8d4dff
                );
        }

        .system {
            align-self: center;

            color: #888;

            font-size: 13px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            display: flex;

            gap: 10px;

            padding: 18px;

            border-top:
                1px solid
                rgba(255,255,255,0.1);
        }

        input {
            flex: 1;

            min-width: 0;

            padding: 14px 18px;

            border: none;
            outline: none;

            border-radius: 15px;

            color: white;

            background:
                rgba(255,255,255,0.08);

            font-size: 15px;
        }

        input::placeholder {
            color: #888;
        }

        button {
            padding: 0 22px;

            border: none;

            border-radius: 15px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #536dff,
                    #8d4dff
                );

            cursor: pointer;

            font-weight: bold;
        }

        button:active {
            transform: scale(0.96);
        }

        @media (max-width: 600px) {

            .container {
                width: 100%;
                height: 100vh;

                margin: 0;

                border-radius: 0;
            }

            .message {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🌌 Space Chat</h1>
        <span id="status">● 연결 중...</span>
    </header>

    <div id="messages">

        <div class="system">
            우주 채팅에 접속했습니다 🚀
        </div>

    </div>

    <form id="chat-form">

        <input
            id="message"
            type="text"
            maxlength="500"
            autocomplete="off"
            placeholder="우주에 메시지를 보내보세요..."
        >

        <button type="submit">
            전송
        </button>

    </form>

</div>

<script>

const socket = io();

const form =
    document.getElementById("chat-form");

const input =
    document.getElementById("message");

const messages =
    document.getElementById("messages");

const status =
    document.getElementById("status");


socket.on("connect", () => {

    status.textContent = "● ONLINE";

    status.style.color = "#7cffc4";

});


socket.on("disconnect", () => {

    status.textContent = "● OFFLINE";

    status.style.color = "#ff6b6b";

});


form.addEventListener(
    "submit",
    (event) => {

        event.preventDefault();

        const text =
            input.value.trim();

        if (!text) {
            return;
        }

        socket.send(text);

        input.value = "";

        input.focus();
    }
);


socket.on("message", (message) => {

    const div =
        document.createElement("div");

    div.className = "message";

    div.textContent = message;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;

});

</script>

</body>
</html>
